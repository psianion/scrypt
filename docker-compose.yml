services:
  scrypt:
    # No platform pin: BuildKit builds for the host arch (works on arm64 + x64).
    # `scrypt init` can also generate docker-compose.override.yml to pin a
    # specific platform and set the ingest mount per-machine.
    build: .
    container_name: scrypt
    restart: unless-stopped
    ports:
      - "3777:3777"
    environment:
      - SCRYPT_AUTH_TOKEN=${SCRYPT_AUTH_TOKEN}
      - SCRYPT_VAULT_PATH=/vault
      - SCRYPT_STATIC_DIR=/app/dist
      - SCRYPT_GIT_AUTOCOMMIT=${SCRYPT_GIT_AUTOCOMMIT:-0}
      - NODE_ENV=production
      # Wave 8: MCP + embeddings config
      - SCRYPT_MCP_HTTP=${SCRYPT_MCP_HTTP:-1}
      - SCRYPT_EMBED_MODEL=${SCRYPT_EMBED_MODEL:-Xenova/bge-small-en-v1.5}
      - SCRYPT_EMBED_CACHE_DIR=/data/embed-cache
      - SCRYPT_EMBED_BATCH=${SCRYPT_EMBED_BATCH:-8}
      - SCRYPT_EMBED_MAX_TOKENS=${SCRYPT_EMBED_MAX_TOKENS:-450}
      - SCRYPT_EMBED_OVERLAP=${SCRYPT_EMBED_OVERLAP:-50}
      - SCRYPT_EMBED_PREWARM=${SCRYPT_EMBED_PREWARM:-1}
      - SCRYPT_EMBED_DISABLE=${SCRYPT_EMBED_DISABLE:-0}
      - SCRYPT_EMBED_TIMEOUT_MS=${SCRYPT_EMBED_TIMEOUT_MS:-300000}
    volumes:
      # Vault lives on the host. Override by setting SCRYPT_VAULT_DIR in .env
      # to any absolute path (e.g. /Users/you/scrypt-vault) so your notes
      # stay outside the repo and survive container rebuilds.
      - ${SCRYPT_VAULT_DIR:-./vault}:/vault
      # Ingest source: mount host files read-only for batch_ingest tool.
      # Defaults to ./ingest (repo-relative) so it works on any OS; override
      # with SCRYPT_INGEST_DIR in .env (or via `scrypt init`).
      - ${SCRYPT_INGEST_DIR:-./ingest}:/ingest:ro
      # Wave 8: embedding model cache — ~33MB download on first boot,
      # reused across rebuilds so you only pay the download once.
      - scrypt-embed-cache:/data/embed-cache
      # ponytail: SQLite WAL mode over a Windows bind mount (virtiofs/gRPC-FUSE)
      # corrupts the db (SQLITE_CORRUPT / SHMOPEN) — park .scrypt state in a
      # named volume so mmap/locking stays on native Docker storage. Markdown
      # content still lives on the host bind mount above; only internal
      # index/db state is isolated here. Revisit if Docker Desktop fixes this.
      - scrypt-state:/vault/.scrypt
    working_dir: /vault

volumes:
  scrypt-embed-cache:
  scrypt-state:
